name: hive_notes
description: "A simple note-taking application using Hive."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Hive packages
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.18.1  # For date formatting

  # Utilities?
  path_provider: ^2.1.5
  uuid: ^4.1.0  # For generating unique IDs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Hive generators
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
